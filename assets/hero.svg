<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" role="img" aria-label="Makiatto's holographic collector card: 704 contributions, 18 followers, 5 repos, 4 day streak">
  <style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  <defs>
    
    <linearGradient id="hero-foil" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="440" y2="460">
      <stop offset="0.00" stop-color="#7c3aed"/><stop offset="0.33" stop-color="#22d3ee"/><stop offset="0.67" stop-color="#4ade80"/><stop offset="1.00" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 220 230;360 220 230" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="hero-foil-flat" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#7c3aed"/><stop offset="0.33" stop-color="#22d3ee"/><stop offset="0.67" stop-color="#4ade80"/><stop offset="1.00" stop-color="#f472b6"/></linearGradient>
    <clipPath id="hero-card"><rect x="40" y="30" width="360" height="400" rx="22"/></clipPath>
    <clipPath id="hero-face"><rect x="64" y="96" width="312" height="190" rx="12"/></clipPath>
  </defs>
  <rect width="880" height="460" rx="18" fill="#07070d"/>

  <g>
    <animateTransform attributeName="transform" type="rotate" values="-1.2 220 430;1.2 220 430;-1.2 220 430" dur="6s" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
    <g clip-path="url(#hero-card)">
      <rect x="40" y="30" width="360" height="400" fill="url(#hero-foil)"/>
      <rect x="48" y="38" width="344" height="384" rx="16" fill="#0b0b16" opacity=".92"/>
      <text x="64" y="76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" fill="#ffffff">Makiatto</text>
      <text x="376" y="76" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#facc15">⚡ 704</text>
      <image href="data:image/jpeg;base64," x="64" y="96" width="312" height="190" preserveAspectRatio="xMidYMid slice" clip-path="url(#hero-face)"/>
      <rect x="64" y="96" width="312" height="190" rx="12" fill="url(#hero-foil-flat)" opacity=".16"/>
      <text x="64" y="312" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="1.5" fill="#a5b4fc">RARE · 5 REPOS · SINCE 2025</text>
      
      <rect x="64" y="327" width="20" height="20" rx="4.4" fill="#3178c6"/>
      <text x="74" y="341" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">TS</text>
      <text x="94" y="342" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e5e7eb">TypeScript</text>
      <text x="376" y="342" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#a5b4fc">70 PWR</text>
      <rect x="64" y="353" width="20" height="20" rx="4.4" fill="#f1e05a"/>
      <text x="74" y="367" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">JS</text>
      <text x="94" y="368" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e5e7eb">JavaScript</text>
      <text x="376" y="368" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#a5b4fc">19 PWR</text>
      <rect x="64" y="379" width="20" height="20" rx="4.4" fill="#336790"/>
      <text x="74" y="393" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">PL</text>
      <text x="94" y="394" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e5e7eb">PLpgSQL</text>
      <text x="376" y="394" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#a5b4fc">7 PWR</text>
    </g>
    
  <defs><linearGradient id="hero-sh" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient></defs>
  <g clip-path="url(#hero-card)">
    <g transform="skewX(-18)">
      <rect x="-180" y="30" width="150" height="400" fill="url(#hero-sh)">
        <animateTransform attributeName="transform" type="translate" values="0 0;1060 0;1060 0" keyTimes="0;0.55;1" dur="5s" begin="0s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
    <rect x="40" y="30" width="360" height="400" rx="22" fill="none" stroke="url(#hero-foil)" stroke-width="3"/>
  </g>

  <text x="450" y="74" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="2.4" fill="#7dd3fc">COLLECTOR'S EDITION · 2026</text>
  <text x="450" y="128" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="44" font-weight="800" letter-spacing="-0.9" fill="#ffffff">@sirikitmac</text>
  <text x="450" y="158" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" fill="#9ca3af">I.T Student</text>
  
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.3s" fill="freeze"/>
    <rect x="450" y="200" width="180" height="80" rx="14" fill="#11111d" stroke="#2a2a44"/>
    <text x="468" y="244" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="800" fill="url(#hero-foil-flat)">704</text>
    <text x="468" y="266" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="1.1" fill="#9ca3af">CONTRIBUTIONS</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.42s" fill="freeze"/>
    <rect x="646" y="200" width="180" height="80" rx="14" fill="#11111d" stroke="#2a2a44"/>
    <text x="664" y="244" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="800" fill="url(#hero-foil-flat)">18</text>
    <text x="664" y="266" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="1.1" fill="#9ca3af">FOLLOWERS</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.54s" fill="freeze"/>
    <rect x="450" y="296" width="180" height="80" rx="14" fill="#11111d" stroke="#2a2a44"/>
    <text x="468" y="340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="800" fill="url(#hero-foil-flat)">5</text>
    <text x="468" y="362" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="1.1" fill="#9ca3af">REPOS</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.6599999999999999s" fill="freeze"/>
    <rect x="646" y="296" width="180" height="80" rx="14" fill="#11111d" stroke="#2a2a44"/>
    <text x="664" y="340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="28" font-weight="800" fill="url(#hero-foil-flat)">4</text>
    <text x="664" y="362" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="1.1" fill="#9ca3af">DAY STREAK</text>
  </g>
</svg>
