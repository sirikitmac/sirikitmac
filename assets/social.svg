<svg xmlns="http://www.w3.org/2000/svg" width="860" height="120" viewBox="0 0 860 120" role="img" aria-label="Connect: GitHub @sirikitmac">
  <style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
  
  <defs>
    
    <linearGradient id="soc-foil" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="860" y2="120">
      <stop offset="0.00" stop-color="#7c3aed"/><stop offset="0.33" stop-color="#22d3ee"/><stop offset="0.67" stop-color="#4ade80"/><stop offset="1.00" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 430 60;360 430 60" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="soc-foil-flat" x1="0" y1="0" x2="1" y2="1"><stop offset="0.00" stop-color="#7c3aed"/><stop offset="0.33" stop-color="#22d3ee"/><stop offset="0.67" stop-color="#4ade80"/><stop offset="1.00" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="soc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b1c"/><stop offset="1" stop-color="#07070d"/>
    </linearGradient>
    <radialGradient id="soc-orb"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.28"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></radialGradient>
    <radialGradient id="soc-orb2"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.14"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="soc-title" x1="0" x2="1"><stop offset="0" stop-color="#c084fc"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
    <clipPath id="soc-clip"><rect x="3" y="3" width="854" height="114" rx="19"/></clipPath>
  </defs>
  <g clip-path="url(#soc-clip)">
    <rect width="860" height="120" fill="url(#soc-bg)"/>
    <ellipse cx="103.2" cy="18" rx="240.8" ry="108" fill="url(#soc-orb)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="731" cy="114" rx="301" ry="96" fill="url(#soc-orb2)">
      <animate attributeName="opacity" values="1;0.6;1" dur="7s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <rect x="1.5" y="1.5" width="857" height="117" rx="21" fill="none" stroke="url(#soc-foil)" stroke-width="3"/>
  <rect x="325" y="34" width="210" height="52" rx="26" fill="#08080c" fill-opacity="0.7" stroke="url(#soc-foil-flat)" stroke-width="1.5"/>
  <circle cx="353" cy="60" r="15" fill="#c084fc" fill-opacity="0.15" stroke="#c084fc" stroke-opacity="0.6"/>
  <text x="353" y="65" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#a5b4fc">G</text>
  <text x="379" y="57" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e5e7eb">GitHub</text>
  <text x="379" y="74" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#a5b4fc">@sirikitmac</text>
  
  <defs><linearGradient id="soc-sh" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient></defs>
  <g clip-path="url(#soc-clip)">
    <g transform="skewX(-18)">
      <rect x="-220" y="0" width="150" height="120" fill="url(#soc-sh)">
        <animateTransform attributeName="transform" type="translate" values="0 0;1280 0;1280 0" keyTimes="0;0.55;1" dur="5s" begin="3s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
